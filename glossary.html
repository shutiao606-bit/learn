<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>术语词典</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html">← 主页</a>
  <span class="where">术语词典</span>
</header>

<h1>术语词典</h1>
<p class="sub">手机上随手查，每条一句话</p>

<div class="card">
  <p>读论文、看视频卡在一个词上，先来这里查。<strong>每条只有一句话 + 一个生活类比</strong>，够你看懂上下文就行，深度讲解在各周的卡里。</p>
</div>

<div class="search-wrap">
  <input type="search" id="q" placeholder="搜术语或解释，比如 PID / 话题 / 扩散" autocomplete="off">
</div>

<p class="hint" id="count"></p>

<div id="list"></div>

<p class="foot">查完就回去继续读，别在这页刷</p>

<script src="nav.js"></script>
<script>
(function () {
  var TERMS = [
    // ---------- 电脑与终端 ----------
    { g: '电脑与终端', t: '路径', d: '文件在磁盘上的位置，一套"在哪一层、叫什么"的写法。', a: '像快递地址：省→市→街道→门牌，少一层就送不到。' },
    { g: '电脑与终端', t: '目录', d: '装文件的"抽屉"，就是文件夹。', a: '抽屉里还能放抽屉，所以有层级。' },
    { g: '电脑与终端', t: '当前目录', d: '你现在站的位置；相对路径都从这个位置开始算。', a: '你在商场几楼，决定了"往前走 10 米"到底通向哪。' },
    { g: '电脑与终端', t: '绝对路径', d: '从最顶层写起的完整地址，在哪敲都一样。', a: '身份证号，全国唯一。' },
    { g: '电脑与终端', t: '相对路径', d: '从当前目录算起的地址，换个位置就指向别处。', a: '"向前走两步"，站在不同地方结果不同。' },
    { g: '电脑与终端', t: '命令', d: '你在终端里敲的那一行，本质是"程序名 + 参数"。', a: '像点菜：菜名（程序）+ 具体要求（参数）。' },
    { g: '电脑与终端', t: '参数 / 选项', d: '跟在命令后面，告诉程序"对谁做、怎么做"。带 - 或 -- 的叫选项。', a: '咖啡的"大杯、少冰、加糖"。' },
    { g: '电脑与终端', t: 'PATH', d: '一串目录，shell 按顺序去里面找你要运行的命令。', a: '手机通讯录：先搜名字，搜到第一个就拨。' },
    { g: '电脑与终端', t: '进程', d: '程序跑起来之后的那份"活的副本"，有 PID、占内存。', a: '菜谱是程序，正在灶上做的那锅菜是进程。' },
    { g: '电脑与终端', t: 'PID', d: '进程编号，系统用来区分同时跑着的多个进程。', a: '叫号器上的号，同一时刻不重复。' },
    { g: '电脑与终端', t: '端口', d: '一台电脑上区分"哪个程序在收数据"的编号。', a: '同一个小区地址，加单元号才知道送哪户。' },
    { g: '电脑与终端', t: '退出码', d: '程序结束时回报的数字，0 表示成功，非 0 表示出问题。', a: '快递签收：0 = 已送达，其他 = 各种送不到的原因。' },
    { g: '电脑与终端', t: '标准输出 / 标准错误', d: '程序往屏幕写字的两个通道，正常信息走前者，报错走后者。', a: '一个说"货已发出"，一个说"路上出事了"，别混着听。' },
    { g: '电脑与终端', t: '挂载', d: '把一个存储设备接到目录树的某个位置，从而能访问它。', a: '在墙上钉一个挂钩，东西就"长"在那了。' },
    { g: '电脑与终端', t: 'WSL', d: '在 Windows 里跑一个真的 Linux，文件互通。', a: '一间房里隔出两个厨房，各用各的灶。' },

    // ---------- 无人机 ----------
    { g: '无人机', t: 'PX4', d: '开源飞控软件，负责让飞机稳定地飞、听指令动。', a: '飞机的小脑，管平衡和动作，不管"去哪"。' },
    { g: '无人机', t: 'ArduPilot', d: '另一个开源飞控，和 PX4 同类竞品，支持更多机型。', a: '同一条街上的另一家店。' },
    { g: '无人机', t: 'iNav', d: '面向固定翼 / 穿越机的轻量飞控固件。', a: '轻便版的小脑，够用但功能少。' },
    { g: '无人机', t: 'MAVLink', d: '飞控和地面站、机载程序之间通信的协议。', a: '双方约定的暗号本，格式不对就听不懂。' },
    { g: '无人机', t: 'QGroundControl', d: '常用的地面站软件，看状态、改参数、规划航线。', a: '遥控室的仪表盘。' },
    { g: '无人机', t: 'SITL', d: '软件在环：飞控程序跑在电脑里，接仿真世界，不用真机。', a: '飞行模拟器。' },
    { g: '无人机', t: 'HITL', d: '硬件在环：真飞控板接电脑上的仿真。', a: '真方向盘 + 游戏里的马路。' },
    { g: '无人机', t: 'Gazebo', d: '机器人 / 无人机常用的物理仿真世界，有重力、碰撞、传感器噪声。', a: '一个可以随便摔飞机的沙盘。' },
    { g: '无人机', t: 'Offboard', d: '外部程序接管飞控的飞行模式，你的代码发指令、飞机执行。', a: '从"手动驾驶"切到"自动驾驶"。' },
    { g: '无人机', t: '机载电脑', d: '绑在飞机上的小电脑（常见 Jetson、树莓派），跑视觉和控制程序。', a: '飞机的随身背包，装计算能力。' },

    // ---------- ROS2 ----------
    { g: 'ROS2', t: '节点', d: '一个独立的小程序，只干一件事，比如读相机、算路径。', a: '工厂里的一个工位。' },
    { g: 'ROS2', t: '话题（Topic）', d: '节点之间单向广播数据的通道，发布者发、订阅者收。', a: '广播电台：谁都可以听，不用认识主播。' },
    { g: 'ROS2', t: '服务（Service）', d: '一问一答的调用，要等对方回结果。', a: '打电话问"有没有货"，等对方答。' },
    { g: 'ROS2', t: '动作（Action）', d: '耗时任务：可以先发目标、中途看进度、随时取消。', a: '点外卖：下单、看骑手到哪、能取消。' },
    { g: 'ROS2', t: 'DDS', d: 'ROS2 底层的通信机制，负责发现邻居和传数据。', a: '小区里的邮递系统。' },
    { g: 'ROS2', t: '工作空间 / 包', d: '工作空间是项目大目录，包是里面一个可编译的模块。', a: '工具箱 vs 里面的一件工具。' },
    { g: 'ROS2', t: 'colcon', d: 'ROS2 的编译工具，一条命令把所有包编译好。', a: '一键把所有零件组装起来。' },
    { g: 'ROS2', t: 'launch', d: '一个脚本，一次启动多个节点并配好参数。', a: '开机脚本：一次把该开的都开起来。' },
    { g: 'ROS2', t: '命名空间', d: '给节点和话题加前缀，用来区分多个同名系统。', a: '宿舍楼 A 的 101 和 B 的 101，不冲突。' },
    { g: 'ROS2', t: 'tf2', d: '维护各个坐标系之间的相对位置和变换。', a: '告诉大家"我在谁的哪个方向多远"。' },
    { g: 'ROS2', t: 'URDF', d: '用文件描述机器人长什么样：连杆、关节、尺寸。', a: '机器人的三维拼装说明书。' },
    { g: 'ROS2', t: 'rviz', d: '可视化工具，把点云、路径、坐标系画出来看。', a: '机器人的"透视眼"。' },

    // ---------- AI 与 VLA ----------
    { g: 'AI 与 VLA', t: 'VLA', d: '视觉-语言-动作模型：看画面 + 听指令 → 直接输出动作。', a: '看菜谱、看锅里，直接动手炒。' },
    { g: 'AI 与 VLA', t: '模仿学习', d: '拿人做示范的数据，训练模型照着做。', a: '学徒看师傅做，然后自己上手。' },
    { g: 'AI 与 VLA', t: '强化学习', d: '不给标准答案，只给奖励，让模型自己试出来。', a: '打游戏靠得分试出最优打法。' },
    { g: 'AI 与 VLA', t: '示教数据', d: '人操作机器人时录下来的"画面 + 动作"序列，训练的主要原料。', a: '师傅的操作录像。' },
    { g: 'AI 与 VLA', t: '动作块（action chunk）', d: '一次预测未来一小段（比如 0.5 秒）的连续动作，而不是一个点。', a: '不是一步步挪，是先想好接下来三步怎么走。' },
    { g: 'AI 与 VLA', t: '扩散策略', d: '把"生成动作"做成"从噪声里一步步去噪"，擅长处理一个情况有多种合理做法。', a: '先糊一团，再慢慢擦出清晰的画。' },
    { g: 'AI 与 VLA', t: 'Flow matching', d: '扩散的亲戚，直接学"从噪声到动作"的流动方向，采样更快。', a: '不走弯路，直接指向终点。' },
    { g: 'AI 与 VLA', t: '世界模型', d: '模型先在"脑内"预测接下来会发生什么，再决定怎么动。', a: '下棋前先在脑子里演几步。' },
    { g: 'AI 与 VLA', t: 'sim2real', d: '仿真里训出来的能力，搬到真机上还能用。', a: '模拟器里练熟了，上车也能开。' },
    { g: 'AI 与 VLA', t: 'Loco-manipulation', d: '一边移动一边操作物体，人形机器人的核心难题。', a: '边走边端盘子不洒。' },
    { g: 'AI 与 VLA', t: 'Transformer / 注意力', d: '现在大模型的基本结构，让每个位置按相关性去"看"其他位置。', a: '开会时谁说话你重点听谁。' },
    { g: 'AI 与 VLA', t: 'token', d: '模型处理的最小单位，文字会被切成 token，动作也能被切成 token。', a: '把一句话拆成积木块。' },
    { g: 'AI 与 VLA', t: '嵌入（embedding）', d: '把文字、图片变成一串数字，让模型能算"像不像"。', a: '给每个东西一个坐标，距离近就是相似。' },
    { g: 'AI 与 VLA', t: '微调 / LoRA', d: '在大模型基础上少量训练，让它适应你的任务，不用从头训。', a: '买现成的西装，只改袖长。' },
    { g: 'AI 与 VLA', t: 'MoE', d: '混合专家：模型里有多套子网络，每次只激活一部分。', a: '医院分诊，不同问题找不同科室。' }
  ];

  var list = document.getElementById('list');
  var input = document.getElementById('q');
  var count = document.getElementById('count');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(kw) {
    kw = (kw || '').trim().toLowerCase();
    var hit = TERMS.filter(function (x) {
      if (!kw) return true;
      return (x.t + x.d + x.a + x.g).toLowerCase().indexOf(kw) >= 0;
    });

    count.textContent = kw ? ('找到 ' + hit.length + ' 条') : ('共 ' + TERMS.length + ' 条');

    if (!hit.length) {
      list.innerHTML = '<div class="card"><p>没找到。换个词试试，比如"进程""话题""扩散"。</p></div>';
      return;
    }

    var groups = [];
    hit.forEach(function (x) {
      if (groups.indexOf(x.g) < 0) groups.push(x.g);
    });

    var html = '';
    groups.forEach(function (g) {
      html += '<h2>' + esc(g) + '</h2><div class="card gloss">';
      hit.filter(function (x) { return x.g === g; }).forEach(function (x) {
        html += '<div class="term"><dt>' + esc(x.t) + '</dt>' +
                '<dd>' + esc(x.d) + '<span class="ana">' + esc(x.a) + '</span></dd></div>';
      });
      html += '</div>';
    });
    list.innerHTML = html;
  }

  input.addEventListener('input', function () { render(input.value); });
  render('');
})();
</script>
</body>
</html>
